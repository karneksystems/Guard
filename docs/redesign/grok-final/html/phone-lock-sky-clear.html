<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><title>Lock clear</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet"/><link rel="stylesheet" href="../shared/guard.css"/><link rel="stylesheet" href="../shared/premium.css"/>
<style>html,body{margin:0;padding:0;background:#000;width:428px;height:926px;overflow:hidden}</style>
</head><body>
<div class="capture" style="width:428px;height:926px">
<div class="phone dark"><div class="notch"></div>
  <div class="lock">
    <div class="di-pill" aria-hidden="true"></div>
    <div class="lock-time">09:06</div>
    <div class="lock-date">Tuesday 1 October</div>
    <div class="la sky">
      <div class="la-row">
        <div class="la-app"><div class="la-ico"><img src="../icon/icon-1024.png" alt="" width="14" height="14"/></div> Guard</div>
        <div class="la-phase sky">ALL CLEAR</div>
      </div>
      <div class="la-main">
        <div class="la-mini-ring"><svg viewBox="0 0 56 56">
      <circle cx="28" cy="28" r="22" fill="none" stroke="rgba(91,200,245,0.18)" stroke-width="4"/>
      <circle cx="28" cy="28" r="22" fill="none" stroke="#5BC8F5" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="138" stroke-dashoffset="0"/></svg></div>
        <div class="la-copy">
          <div class="la-count sky">Clear</div>
          <div class="la-sub">You're clear · trade at your pace</div>
          <div class="la-detail">Cover ended<span class="la-dot">·</span>Trade at your own pace</div>
        </div>
      </div>
    </div>
    <div class="lock-hint">Swipe up to unlock</div>
  </div>
</div></div>
</body></html>
