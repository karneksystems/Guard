<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><title>Lock open</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet"/><link rel="stylesheet" href="../shared/guard.css"/><link rel="stylesheet" href="../shared/premium.css"/>
<style>html,body{margin:0;padding:0;background:#000;width:428px;height:926px;overflow:hidden}</style>
</head><body>
<div class="capture" style="width:428px;height:926px">
<div class="phone dark"><div class="notch"></div>
  <div class="lock">
    <div class="di-pill" aria-hidden="true"></div>
    <div class="lock-time">08:56</div>
    <div class="lock-date">Tuesday 1 October</div>
    <div class="la red">
      <div class="la-row">
        <div class="la-app"><div class="la-ico"><img src="../icon/icon-1024.png" alt="" width="14" height="14"/></div> Guard</div>
        <div class="la-phase red">COVER ON</div>
      </div>
      <div class="la-main">
        <div class="la-mini-ring"><svg viewBox="0 0 56 56">
      <circle cx="28" cy="28" r="22" fill="none" stroke="rgba(229,72,77,0.18)" stroke-width="4"/>
      <circle cx="28" cy="28" r="22" fill="none" stroke="#E5484D" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="138" stroke-dashoffset="70"/></svg></div>
        <div class="la-copy">
          <div class="la-count red">08:30</div>
          <div class="la-sub">Gold · EUR CPI · until 9:05</div>
          <div class="la-detail">High · Cover 8:55–9:05<span class="la-dot">·</span>Stay out · look ok</div>
        </div>
      </div>
    </div>
    <div class="lock-hint">Swipe up to unlock</div>
  </div>
</div></div>
</body></html>
