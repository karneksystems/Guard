<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><title>Tablet cover soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet"/><link rel="stylesheet" href="../shared/guard.css"/><link rel="stylesheet" href="../shared/premium.css"/>
<style>html,body{margin:0;padding:0;background:#000;width:834px;height:1194px;overflow:hidden}</style>
</head><body>
<div class="capture tablet-cap" style="width:834px;height:1194px">
<div class="tablet"><div class="glow amber" style="border-radius:24px"></div>
  <div class="gate amber-phase" style="height:100%">
    <div class="gate-frame" style="inset:48px 80px 48px"><span class="corner-bl"></span><span class="corner-br"></span></div>
    <div class="body" style="padding:48px 120px;max-width:640px;margin:0 auto;width:100%">
      <div class="gate-kicker">Opens soon</div>
      <div class="gate-arc-wrap" style="margin:40px auto"><svg viewBox="0 0 240 240">
      <circle cx="120" cy="120" r="100" fill="none" stroke="rgba(245,165,36,0.1)" stroke-width="8"/>
      <circle cx="120" cy="120" r="100" fill="none" stroke="#F5A524" stroke-width="8"
        stroke-linecap="round" stroke-dasharray="628" stroke-dashoffset="172"
        transform="rotate(-90 120 120)"/></svg>
        <div class="gate-arc-num"><div class="t">04:12</div><div class="u">until cover starts</div></div>
      </div>
      <div class="gate-info">
        <div class="gi"><div class="k">What</div><div class="v" style="font-size:15px">Gold · EUR CPI</div></div>
        <div class="gi"><div class="k">When</div><div class="v sky">Today · 8:55–9:05</div></div>
        <div class="gi"><div class="k">Mode</div><div class="v sky">Cover · look ok</div></div>
        <div class="gi"><div class="k">Promise</div><div class="v sky" style="font-size:12px">Never touch trades</div></div>
      </div>
      <div class="gate-promise" style="margin-top:32px">We never touch your trades. Looking is fine. Trading now may break your firm's rules.</div>
      <div class="gate-actions" style="max-width:400px;margin:16px auto 0">
        <button class="btn-stay">Stay out</button>
        <button class="btn-hold"><span class="hold-ring"></span> Hold to look only</button>
      </div>
    </div>
  </div>
</div></div>
</body></html>
