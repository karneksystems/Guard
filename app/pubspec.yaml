name: guard_app
description: "Prop-firm news guard. Phone, tablet and desktop from one tree. Codename guard; product name TBD."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  http: ^1.6.0
  launch_at_startup: ^0.5.1
  path_provider: ^2.1.6
  rule_engine:
    path: ../packages/rule_engine
  timezone: ^0.11.1
  tray_manager: ^0.5.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray/guard.ico
    - assets/tray/guard.png
  # Poppins (display) and Inter (body) font files are bundled in M2 once the design
  # pass lands. Until then the theme names the families and the OS falls back.
