name: guard_app
description: "Prop-firm news guard. Phone, tablet and desktop from one tree. Codename guard; product name TBD."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  http: ^1.6.0
  launch_at_startup: ^0.5.1
  path_provider: ^2.1.6
  rule_engine:
    path: ../packages/rule_engine
  timezone: ^0.11.1
  tray_manager: ^0.5.3
  window_manager: ^0.5.2

dev_dependencies:
  msix: ^3.16.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray/guard.ico
    - assets/tray/guard.png
  # Poppins (display) and Inter (body), both SIL Open Font License; licences sit
  # next to the files. Inter is the variable font, one file for every weight.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

# Windows package. Unsigned until the code-signing certificate exists; the
# msix-package job in .github/workflows/native.yml builds it on demand.
msix_config:
  display_name: Guard
  publisher_display_name: Stanchion Systems Ltd
  identity_name: Stanchion.Guard
  msix_version: 0.1.0.0
  logo_path: assets/tray/guard.png
  capabilities: internetClient
  sign_msix: false
  install_certificate: false
  build_windows: false
