name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  packs-and-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - run: python3 schema/validate_packs.py
      - run: python3 fixtures/rule-engine/reference.py --check

  engine-dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
        working-directory: packages/rule_engine
      - run: dart analyze --fatal-infos
        working-directory: packages/rule_engine
      - run: dart test
        working-directory: packages/rule_engine

  engine-php-and-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
      - run: composer install --no-interaction --prefer-dist
        working-directory: packages/rule-engine-php
      - run: vendor/bin/phpunit
        working-directory: packages/rule-engine-php
      - run: composer install --no-interaction --prefer-dist --no-scripts
        working-directory: backend
      - run: cp .env.example .env && php artisan key:generate
        working-directory: backend
      - run: php artisan test
        working-directory: backend

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app

  # Compiles the Kotlin side (channels, gate service). The runner image carries
  # the Android SDK; this is the only place the native code gets built in CI.
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: app
      - run: flutter build apk --debug
        working-directory: app

  # Compiles the Win32 watcher and the desktop plugins.
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: app
      - run: flutter build windows --debug
        working-directory: app
